vendorConfig:
  vendorFolder: REPLACE_WITH_VENDOR_FOLDER
default:
  vendorFolder: '{vendorFolder}'
  locked: false
vendorDependencies:
  vendorfiles-rs:
    repository: https://github.com/Araxeus/vendorfiles-rs
    files:
      - '{release}/vendor_v{version}_linux.tar.gz':
          - vendor
  ls-interactive:
    repository: https://github.com/Araxeus/ls-interactive
    files:
      - '{release}/lsi_v{version}_linux.tar.gz':
          - ls-interactive
  micro:
    repository: https://github.com/zyedidia/micro
    files:
      - '{release}/micro-{version}-linux64.tar.gz':
          micro-{version}/micro: micro
  fd:
    repository: https://github.com/sharkdp/fd
    files:
      - '{release}/fd-v{version}-x86_64-unknown-linux-musl.tar.gz':
          fd-v{version}-x86_64-unknown-linux-musl/fd: fd
  ripgrep:
    repository: https://github.com/burntsushi/ripgrep
    files:
      - '{release}/ripgrep-{version}-x86_64-unknown-linux-musl.tar.gz':
          ripgrep-{version}-x86_64-unknown-linux-musl/rg: rg
  bat:
    repository: https://github.com/sharkdp/bat
    files:
      - '{release}/bat-v{version}-x86_64-unknown-linux-musl.tar.gz':
          bat-v{version}-x86_64-unknown-linux-musl/bat: bat
  fzf:
    repository: https://github.com/junegunn/fzf
    files:
      - '{release}/fzf-{version}-linux_amd64.tar.gz':
          - fzf
